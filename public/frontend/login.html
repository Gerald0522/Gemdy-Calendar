<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | GEMDY</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="main" style="max-width:500px;margin:8vh auto">
        <section class="card">
            <h1>Iniciar sesión</h1>
            <p>Accede a tus tareas de GEMDY Calendar.</p>
            <form id="login-form">
                <div class="field"><label for="correo">Correo</label><input id="correo" name="correo" type="email"
                        required></div>
                <div class="field"><label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena"
                        type="password" required></div>
                <p id="login-error" role="alert" aria-live="polite"></p><button class="button"
                    type="submit">Ingresar</button>
            </form>
        </section>
    </main>
    <script type="module" src="js/login.js"></script>
</body>

</html>
